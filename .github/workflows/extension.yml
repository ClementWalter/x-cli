# Claude Desktop extension: a v* tag publishes x-cli.mcpb on its GitHub release.
name: extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  extension:
    permissions:
      contents: write
    uses: ClementWalter/mcp-bridge/.github/workflows/extension.yml@a9c873e60ce2684d4ed42e74041bb845972a6557
    with:
      launcher: bin/x
      bridge-ref: a9c873e60ce2684d4ed42e74041bb845972a6557
